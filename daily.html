<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a day · Tokyo Weekday Club</title><meta name="description" content="Japanese for kids aged 6–12 in Tokyo. Book individual 3-hour sessions for ¥14,000 per child, or a 4-day week for ¥48,000."><link rel="icon" href="/favicon-32.png"><link rel="stylesheet" href="/assets/daily.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Inter:wght@400;500;600;700&family=Huninn&display=swap" rel="stylesheet"></head>
<body><header><a class="brand" href="/">tokyo <em>weekday</em> club<span>●</span></a><nav aria-label="Language"><a href="/daily" lang="en">EN</a><a href="/daily?lang=zh" lang="zh-Hant">繁體中文</a></nav></header>
<main id="book"><p class="eyebrow" data-en="MEGURO · AGES 6–12 · MONDAY–THURSDAY" data-zh="目黑 · 6–12 歲 · 星期一至四"></p><h1 data-en="A little Japanese.\nA day that fits." data-zh="學一點日文，\n揀適合你的一天。"></h1><p class="intro" data-en="One day, or a few. Choose the dates that fit your Tokyo trip." data-zh="參加一日，或幾日。按你的東京行程，自選上課日期。"></p>
<div class="plans"><div class="plan active"><span data-en="Single days" data-zh="單日報名"></span><strong>¥14,000<span data-en=" / child / day" data-zh="／位／日"></span></strong><small data-en="3 hours · all materials included" data-zh="3 小時 · 包含所有教材"></small></div><a class="plan" id="weekly-link" href="/#book"><span data-en="4-day week" data-zh="4 日整週課程"></span><strong>¥48,000<span data-en=" / child" data-zh="／位"></span></strong><small data-en="¥12,000 a day · book a week →" data-zh="平均每日 ¥12,000 · 預約整週 →"></small></a></div>
<p class="policy" data-en="Choose a morning (09:00–12:00) or afternoon (14:00–17:00). All times are Tokyo time. Each session needs at least 3 children confirmed at least 14 days before class, with a maximum of 6. Unconfirmed classes close at that deadline. Your saved card is charged only when the selected session is confirmed; confirmed classes may be charged immediately. No charge for classes that do not run." data-zh="自選上午 09:00–12:00 或下午 14:00–17:00，全部為東京時間。每節最少 3 人、最多 6 人，須於上課前最少 14 日確認開班；屆時未夠人即不開班。同一日、同一時段確認開班後才從已儲存的信用卡收費。已確認班別可隨即扣款；未能開班不收費。"></p>
<section id="success" class="notice" hidden><h2 data-en="Your card setup is complete." data-zh="信用卡設定已完成。"></h2><p data-en="We are processing your booking. Watch for your confirmation email with the selected dates, booking reference and cancellation link. If your session is already confirmed, payment may follow now." data-zh="我們正處理你的預約。請留意確認電郵，內有上課日期、預約編號及取消連結。如班別已確認開辦，可隨即收費。"></p><p id="booking-ref"></p><a href="/daily" data-en="Make another booking →" data-zh="預約其他日期 →"></a></section>
<form id="daily-form"><section class="panel"><h2 data-en="1 · Choose your days" data-zh="1 · 選擇上課日期"></h2><label for="week" data-en="Week beginning" data-zh="選擇星期"></label><select id="week" disabled></select><p id="availability-status" role="status" data-en="Loading available dates…" data-zh="正在載入可選日期⋯"></p><div id="dates" class="dates"></div><p class="muted" data-en="Confirmed classes with spaces accept bookings until 23:59 Tokyo time the day before. One 3-hour session per child per day; no lunch or full-day care." data-zh="已確認且有名額的班別，可於上課前一日東京時間 23:59 前補位。每位小朋友每日選一節 3 小時課堂，不包括午餐或全日託管。"></p><div id="selected" aria-live="polite"></div></section>
<section class="panel"><h2 data-en="2 · Your details" data-zh="2 · 你的資料"></h2><div class="fields"><label><span data-en="Parent's first name" data-zh="家長名字"></span><input name="firstname" autocomplete="given-name" maxlength="60" required></label><label><span data-en="Parent's last name" data-zh="家長姓氏"></span><input name="lastname" autocomplete="family-name" maxlength="60" required></label><label><span data-en="Email" data-zh="電郵"></span><input name="email" type="email" autocomplete="email" maxlength="180" required></label><label><span data-en="Mobile / WhatsApp (with country code)" data-zh="電話／WhatsApp（包括國際區號）"></span><input name="whatsapp" type="tel" autocomplete="tel" placeholder="+852 1234 5678" pattern="\+[0-9 ()-]{7,30}" required></label><label><span data-en="Number of children" data-zh="小朋友人數"></span><select name="kidsCount" id="kids-count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label><span data-en="Referred by a friend? (optional)" data-zh="朋友介紹？（可留空）"></span><input name="referral" maxlength="120"></label></div><div id="children"></div><input name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true"></section>
<section class="panel summary"><h2 data-en="3 · Review your booking" data-zh="3 · 核對預約"></h2><div id="total" aria-live="polite">¥0</div><p id="breakdown"></p><p id="weekly-saving" class="notice" hidden></p><p data-en="Charged in Japanese yen. Cancel free before confirmation and charging. After confirmation: 50% refund with at least 14 days' notice before that booked day; less than 14 days and no-shows are non-refundable. Contact us about changes." data-zh="以日圓收費。確認開班及扣款前可免費取消。確認後，該預約上課日前 14 日或以上通知可退 50%；少於 14 日或缺席恕不退款。更改預約請聯絡我們。"></p><label class="check"><input type="checkbox" name="terms" value="yes" required><span><span data-en="I agree to the " data-zh="本人同意"></span><a id="terms-link" href="/terms" target="_blank" rel="noopener" data-en="terms and conditions" data-zh="條款及細則"></a><span data-en=" and authorise charges for the selected sessions once confirmed." data-zh="，並授權於所選班別確認開辦後收費。"></span></span></label><p id="error" role="alert"></p><button id="submit" class="primary" type="submit" disabled data-en="Save card securely →" data-zh="安全儲存信用卡 →"></button><p class="muted" data-en="You will review the amount again on Stripe. No recurring subscription." data-zh="你可在 Stripe 再次核對金額。此預約不會自動續訂。"></p></section></form>
</main><footer><a href="mailto:hello@tokyoweekdayclub.com">hello@tokyoweekdayclub.com</a><p>MAKKAM Language Room · Aliquot Turm 5/F, 5-10-19 Megurohoncho, Tokyo</p><a href="/" data-en="← Back to Tokyo Weekday Club" data-zh="← 返回 Tokyo Weekday Club"></a></footer><script type="module" src="/assets/daily.js"></script></body></html>
